[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "ts2net"
version = "0.8.0"
description = "Time series to network conversion and analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Kyle T. Jones", email = "kyle@kyletjones.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]

# Core dependencies (network builders, sklearn integration, visualization)
dependencies = [
    "numpy>=1.23",
    "networkx>=3.0",
    "pandas>=1.5",
    "matplotlib>=3.8",
    "scipy>=1.9",
    "joblib>=1.0",
    "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/kylejones200/ts2net"
Repository = "https://github.com/kylejones200/ts2net"
Issues = "https://github.com/kylejones200/ts2net/issues"
Documentation = "https://ts2net.readthedocs.io"

# Optional dependencies
[project.optional-dependencies]
# YAML pipeline CLI and Parquet I/O
pipeline = [
    "click>=8.0",
    "pyyaml>=6.0",
    "polars>=0.20",
    "pyarrow>=12.0",
    "fastparquet>=2023.0.0",
]
# Alias for Polars-based ingestion (subset of pipeline)
polars = ["polars>=0.20", "pyarrow>=12.0"]
# Structural time series decomposition
bsts = ["statsmodels>=0.14"]
# Performance and method extras
speed = ["numba"]
dtw = ["tslearn"]
approx = ["pynndescent"]
rdata = ["pyreadr"]
gpu = []  # cudtw not available on PyPI; install manually if needed
examples = ["pandas-datareader", "signalplot"]
cnn = ["torch>=2.0"]
viz = ["plotly>=5.0"]
# ML integration (0.7)
pyg = ["torch>=2.0", "torch-geometric>=2.5.0"]
dgl = ["dgl>=2.0"]
tsfresh = ["tsfresh>=0.20"]
ml = ["torch>=2.0", "torch-geometric>=2.5.0", "tsfresh>=0.20"]
# All optional features
all = [
    "click>=8.0",
    "pyyaml>=6.0",
    "polars>=0.20",
    "pyarrow>=12.0",
    "fastparquet>=2023.0.0",
    "statsmodels>=0.14",
    "numba",
    "tslearn",
    "pynndescent",
    "pyreadr",
    "pandas-datareader",
    "signalplot",
    "torch>=2.0",
    "plotly>=5.0",
    "torch-geometric>=2.5.0",
    "tsfresh>=0.20",
]

# Development dependencies (PEP 735 dependency groups)
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=2.5.0",
    "pytest-timeout>=2.0.0",
    "hypothesis>=6.0.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.12",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "torch>=2.0",
    # Extras needed for full test suite
    "click>=8.0",
    "pyyaml>=6.0",
    "polars>=0.20",
    "pyarrow>=12.0",
    "fastparquet>=2023.0.0",
    "statsmodels>=0.14",
    "plotly>=5.0",
    "tqdm>=4.0",
    "pynndescent",
    "numba",
    "tslearn",
]

[project.scripts]
ts2net = "ts2net._cli_entry:main"

# Maturin configuration for Rust extension
[tool.maturin]
# Path to the Cargo.toml of the Rust project (relative to the project root)
manifest-path = "./ts2net_rs/Cargo.toml"
# Build in release mode for better performance
release = true
# Strip the binary to reduce size
strip = true
# Include LICENSE file in source distribution
sdist-include = ["LICENSE", "README.md", "CITATION.md", "CHANGELOG.md"]

[tool.coverage.run]
branch = true
source = ["ts2net"]

[tool.coverage.report]
fail_under = 15
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
files = [
    "ts2net/__init__.py",
    "ts2net/api.py",
    "ts2net/exceptions.py",
    "ts2net/protocols.py",
    "ts2net/_validation.py",
    "ts2net/_builder_api.py",
]

# Pytest configuration
[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E203"]  # Compatible with black
extend-ignore = []

[tool.ruff.lint.per-file-ignores]
"ts2net/sklearn/*.py" = ["N802", "N803", "N806"]  # sklearn API uses X, y

# Flake8 configuration (for compatibility)
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
