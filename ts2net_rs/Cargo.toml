[package]
name = "ts2net_rs"
version = "0.9.0"
authors = ["Kyle Jones, kyle@kyletjones.com"]
edition = "2021"
description = "High-performance time series to network conversion in Rust"
repository = "https://github.com/kylejones200/ts2net-rs"
license = "MIT"

[lib]
name = "ts2net_rs"
# cdylib for the CPython extension maturin builds; rlib so the algorithm
# modules can be used as an ordinary Rust dependency.
crate-type = ["cdylib", "rlib"]

[dependencies]
# ndarray is pinned to the same major version numpy re-exports, so cargo
# unifies them to one crate and `ndarray::Array2` and `numpy::ndarray::Array2`
# stay the same type. Bump both together.
ndarray = "0.17"
pyo3 = { version = "0.28", optional = true }
numpy = { version = "0.28", optional = true }
rayon = "1.10"
kiddo = "4"   # Fast k-d tree with constant dimension support
rand = "0.8"  # Random number generation
rand_distr = "0.4"  # Random distributions
rustfft = "6"  # Fast Fourier transforms
num-complex = "0.4"  # Complex number support
approx = "0.5"  # Approximate equality comparisons

[features]
# `python` builds src/python.rs, the PyO3 binding layer, and is what maturin
# compiles. `extension-module` is part of it because the artifact is always
# loaded by a host interpreter rather than linked against libpython.
#
# Rust consumers depend on this crate with `default-features = false` and get
# the algorithm modules with no PyO3 or NumPy in the tree. That is also the
# configuration the Rust unit tests run under, since a test binary cannot link
# against the symbols `extension-module` deliberately leaves undefined:
#
#     cargo test --no-default-features
default = ["python"]
python = ["dep:pyo3", "dep:numpy", "pyo3/extension-module"]

[dev-dependencies]
approx = "0.5"
rstest = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
