name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev libbz2-dev liblzma-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          uv sync --group dev
          # Install CPU-only PyTorch (much smaller, ~200MB vs ~3GB with CUDA)
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional dependencies
          uv pip install numba tslearn pynndescent pyreadr || true
          # Verify torch is installed
          uv run python -c "import torch; print(f'PyTorch {torch.__version__} (CPU-only) installed')"
      - name: Lint (API hardening modules)
        run: |
          uv run ruff check ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
          uv run ruff format --check ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
      - name: Type check (public API)
        run: uv run mypy ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
      - name: Benchmark smoke test
        env:
          TS2NET_SKIP_LARGE: "1"
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_benchmarks.py --repeats 1
      - name: Literature validation smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_validation.py
      - name: UCR benchmark smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_ucr_benchmark.py
      - name: When graphs win smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/when_graphs_win.py
      - name: Run tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv run pytest -q --cov=ts2net --cov-report=term --cov-fail-under=15
