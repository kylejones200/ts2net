name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libblas-dev liblapack-dev libbz2-dev liblzma-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: |
          uv sync --group dev
          # Install CPU-only PyTorch (much smaller, ~200MB vs ~3GB with CUDA)
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional dependencies
          uv pip install numba tslearn pynndescent pyreadr || true
          # Verify torch is installed
          uv run python -c "import torch; print(f'PyTorch {torch.__version__} (CPU-only) installed')"
      - name: Rust checks (both feature configurations)
        run: |
          cargo check --manifest-path ts2net_rs/Cargo.toml --no-default-features
          cargo check --manifest-path ts2net_rs/Cargo.toml
      - name: Rust tests
        # --no-default-features drops the PyO3 bindings. A test binary cannot
        # link the symbols pyo3's extension-module feature leaves undefined, so
        # a plain `cargo test` fails at the link step.
        run: cargo test --manifest-path ts2net_rs/Cargo.toml --no-default-features
      - name: Rust library has no Python dependencies
        # Architectural contract: `default-features = false` is how another
        # Rust crate consumes ts2net_rs, and that build must contain no pyo3
        # and no numpy. Also asserted by tests/dependency_purity.rs; repeated
        # here so the contract is visible as its own CI gate.
        run: |
          cargo tree --manifest-path ts2net_rs/Cargo.toml \
            --no-default-features --edges normal --prefix none \
            | awk '{print $1}' | sort -u > /tmp/rust-only-deps.txt
          if grep -qE '^(pyo3|pyo3-ffi|pyo3-macros|pyo3-macros-backend|pyo3-build-config|numpy)$' /tmp/rust-only-deps.txt; then
            echo "::error::PyO3 or NumPy leaked into the default-features=false build"
            grep -E '^(pyo3|numpy)' /tmp/rust-only-deps.txt
            exit 1
          fi
          echo "Rust-only dependency tree is free of pyo3 and numpy."
      - name: Lint baseline (no new Ruff debt)
        # The repository carries inherited Ruff debt frozen in
        # .lint-baseline.json. This step fails only when a change adds
        # findings, so main stays green while the debt stays visible.
        # `make lint-debt` prints the full outstanding total.
        run: uv run python scripts/lint_baseline.py check
      - name: Lint (API hardening modules)
        run: |
          uv run ruff check ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
          uv run ruff format --check ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
      - name: Type check (public API)
        run: uv run mypy ts2net/exceptions.py ts2net/_validation.py ts2net/_builder_api.py ts2net/protocols.py ts2net/api_tiers.py ts2net/reports/__init__.py ts2net/causal/summary.py ts2net/dynamic/summary.py ts2net/datasets/ucr.py
      - name: Benchmark smoke test
        env:
          TS2NET_SKIP_LARGE: "1"
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_benchmarks.py --repeats 1
      - name: Literature validation smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_validation.py
      - name: UCR benchmark smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/run_ucr_benchmark.py
      - name: When graphs win smoke
        env:
          TS2NET_CI_SMOKE: "1"
        run: uv run python benchmarks/when_graphs_win.py
      - name: Run tests
        env:
          PYTHONHASHSEED: "0"
        run: |
          uv run pytest -q --cov=ts2net --cov-report=term --cov-fail-under=15
