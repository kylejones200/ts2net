[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --cov=ts2net --cov-report=term-missing --cov-report=html -m "not hard_validation and not slow and not benchmark"
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
markers =
    hard_validation: rigorous correctness tests (slow, run explicitly)
    slow: slow tests
    benchmark: performance benchmark tests
    validation: literature and paper-reproduction validation checks
